name: lxd-agent
depends:
  - service: cri
container:
  entrypoint: ./lxd-agent-loader
  security:
    maskedPaths: []
    readonlyPaths: []
    rootfsPropagation: rshared
    # The loader creates /mnt in the service rootfs before mounting the
    # shared tmpfs on it; Talos mounts extension service rootfses
    # read-only in the container unless this is set.
    writeableRootfs: true
  mounts:
    - source: /dev
      destination: /dev
      type: bind
      options:
        - rshared
        - rbind
        - rw
    - source: /run
      destination: /run
      type: bind
      options:
        - rshared
        - rbind
        - rw
restart: always
logToConsole: true
